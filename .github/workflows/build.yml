herename: Build AlMizan APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: unzip -q almizan-accounting.zip

      - name: Build Android project with Capacitor
        working-directory: almizan-accounting
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android

      - name: Add Storage and Bluetooth Permissions
        working-directory: almizan-accounting
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        working-directory: almizan-accounting/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AlMizan-Accounting-APK
          path: almizan-accounting/android/app/build/outputs/apk/debug/app-debug.apk
