name: Build AlMizan APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: unzip -q almizan-accounting.zip

      - name: Setup Capacitor Android
        working-directory: almizan-accounting
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        working-directory: almizan-accounting/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AlMizan-Accounting-APK
          path: almizan-accounting/android/app/build/outputs/apk/debug/app-debug.apk
